[project]
name = "llm-zoomcamp"
version = "0.1.0"
description = "My solutions for DataTalksClub LLM Zoomcamp"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gitsource>=0.0.5",
    "google-genai>=2.18.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "minsearch>=0.2.0",
    "protobuf>=7.36.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-ai-slim[google]>=2.46.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "sqlitesearch>=0.3.0",
    "torch>=2.14.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # long lines are prompt/text literals
